[project]
name = "security_camera_project"
version = "0.1.0"
description = "A security camera system with motion detection and video analytics."

# Specify Python version requirement
requires-python = "==3.12.*"

# List your dependencies here
dependencies = [
    "opencv-python==4.11.0.86",
    "numpy==2.3.5",
    "pillow==12.0.0",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "ultralytics==8.3.235",
    "openai==1.109.1",
    "python-dotenv==1.2.1",
    "lap==0.5.12",
    "transformers==4.57.3",
    "num2words==0.5.14",
    "av==16.0.1",
    "label-studio-sdk==2.0.16",
    "label-studio==1.22.0",
    "tqdm==4.67.1",
    "pyyaml==6.0.3",
    "onvif-zeep==0.2.12",
    "WSDiscovery==2.1.2",
    "boto3>=1.36.0",
    "openpyxl>=3.1.0",
    "ijson>=3.4.0.post0",
    "awscli>=1.44.62",
    "yt-dlp>=2024.12.0",
]

[tool.uv]
# ultralytics pulls opencv-python-headless which overwrites the GUI build.
# Redirect any request for opencv-python-headless to the GUI build so
# cv2.imshow / cv2.namedWindow work after `uv sync` on a fresh machine.
override-dependencies = [
    "opencv-python-headless ; sys_platform == 'never'",
]

# CUDA 12.8 torch wheels. Falls back to CPU on machines without a CUDA driver.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
