# ──────────────────────────────────────────────────────────────────────────────
#  Label export analysis pipeline configuration
# ──────────────────────────────────────────────────────────────────────────────

s3:
  bucket: "security-camera-project-v1"
  prefix: "dataset_uca"
  region: "us-east-1"

# COCO class-id -> label name (must match labeling config)
coco_labels:
  0: "person"
  1: "bicycle"
  2: "car"
  3: "motorcycle"
  5: "bus"
  7: "truck"
  14: "bird"
  15: "cat"
  16: "dog"

# Default output directory (relative to project root)
output_dir: "./uca_dataset_batch_analysis_output"
