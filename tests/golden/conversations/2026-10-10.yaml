      max_questions: 0
      must_not: ["כל יום 07:00", "עד יום ה׳ 15\\.10"]
      ideal: "צודק, לא קשור בכלל — סליחה. מה שאמרת נשמר: במצלמה 2 זה הבית של השכן, ומה שקורה שם לא יגיע אליך."
    notes: "A short apology, no defence, no second dump; finish the job he asked for at 13:48. Removing the workers' marks would be wrong: he complains about the mention, not the marks."

