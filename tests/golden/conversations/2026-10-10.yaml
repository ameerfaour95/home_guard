      - {time: "13:49:34", owner: "מה קשר ? לא הבנתי", bot: "שמור אצלי עכשיו: העובדים של הפרגולה, כל יום 07:00–18:00, עד יום ה׳ 15.10; העובדים של הפרגולה בכניסה ראשית, כל יום 07:00–18:00, עד יום ה׳ 15.10. מה לתקן?"}
